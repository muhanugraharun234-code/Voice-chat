name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cari project Android (folder atau zip)
        id: locate
        run: |
          find_project() {
            find "$1" \( -name node_modules -o -name .git \) -prune -o -name settings.gradle -print | head -n 1
          }

          # 1. Cek apakah folder project sudah ada di repo
          GRADLE_FILE=$(find_project .)

          # 2. Kalau belum, cari zip di repo yang berisi settings.gradle, lalu ekstrak
          if [ -z "$GRADLE_FILE" ]; then
            for z in $(find . -name "*.zip" -not -path "./.git/*"); do
              if unzip -l "$z" | grep "settings.gradle$" > /dev/null; then
                echo "Mengekstrak $z"
                rm -rf build-src
                mkdir build-src
                unzip -q "$z" -d build-src
                GRADLE_FILE=$(find_project build-src)
                break
              fi
            done
          fi

          if [ -z "$GRADLE_FILE" ]; then
            echo "::error::Project Android tidak ditemukan. Upload zip project (yang berisi settings.gradle) ke root repo."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          PROJECT_DIR="${PROJECT_DIR#./}"
          echo "Project Android ditemukan di: $PROJECT_DIR"
          ls "$PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK (sudah terpasang di runner)
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          test -d "$SDK/platforms/android-35"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: voice-chat-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
